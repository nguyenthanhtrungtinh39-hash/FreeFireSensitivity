name: Build PyzTech APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PyzTech-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PyzTech source
        shell: bash
        run: |
          test -f PyzTech-source.zip || { echo "Missing PyzTech-source.zip at repository root"; exit 1; }
          mkdir -p extracted
          unzip -q PyzTech-source.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle Android project found in PyzTech-source.zip"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .
          test -f ./gradlew || { echo "Gradle wrapper is missing"; exit 1; }
          chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Download required native libraries
        env:
          GH_TOKEN: ${{ secrets.ZALOXPOSEDNATIVE_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing repository secret: ZALOXPOSEDNATIVE_REPO_TOKEN"
            exit 1
          fi
          ASSET_URL="$(gh api repos/ElectroHeavenVN/ZaloXposedNative/releases/tags/lib --jq '.assets[] | select(.name == "Output.zip") | .url')"
          if [ -z "$ASSET_URL" ]; then
            echo "Output.zip not found in ZaloXposedNative release tag lib"
            exit 1
          fi
          gh api "$ASSET_URL" --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/Output.zip"
          mkdir -p ZaloXposedNative
          unzip -q -o "$RUNNER_TEMP/Output.zip" -d ZaloXposedNative

      - name: Build debug APK
        shell: bash
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PversionCode="$VERSION_CODE" \
            -PversionName="pyztech-$SHORT_SHA"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          find app/build/outputs/apk/debug -type f -name '*.apk' -exec cp {} release/PyzTech-debug.apk \;
          test -s release/PyzTech-debug.apk

      - name: Upload PyzTech APK
        uses: actions/upload-artifact@v4
        with:
          name: PyzTech-debug-apk
          path: release/PyzTech-debug.apk
          if-no-files-found: error
