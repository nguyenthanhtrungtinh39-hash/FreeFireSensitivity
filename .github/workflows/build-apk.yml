name: Build PyzTech APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout ZaloXposed source
        uses: actions/checkout@v4
        with:
          repository: ElectroHeavenVN/ZaloXposed
          ref: main
          path: source

      - name: Apply PyzTech branding
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/io/github/electroheavenvn/zaloxposed/MorpheConstants.java")
          s = p.read_text()
          old = 'private static final String MODULE_NAME = "ZaloXposed";'
          if old not in s:
              raise SystemExit("Expected module branding line not found; review upstream changes")
          p.write_text(s.replace(old, 'private static final String MODULE_NAME = "PyzTech";'))
          p = Path("app/src/main/java/io/github/electroheavenvn/zaloxposed/ZaloXposedLoader.java")
          s = p.read_text().replace('Logger.i("Loading ZaloXposed");', 'Logger.i("Loading PyzTech");')
          p.write_text(s)
          p = Path("app/src/main/res/layout/custom_splash_xposed.xml")
          s = p.read_text()
          replacement = '''<TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="PyzTech"
                  android:textColor="#FFFFFF"
                  android:textSize="42sp"
                  android:textStyle="bold"
                  tools:ignore="HardcodedText" />'''
          s, count = re.subn(r'<ImageView\b[^>]*/>', replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace Xposed splash logo")
          p.write_text(s.replace("Developed by ElectroHeavenVN", "PyzTech"))
          app_strings = Path("app/src/main/res/values/strings.xml").read_text()
          if '<string name="app_name">ZaloXposed</string>' not in app_strings:
              raise SystemExit("Launcher label differs from expected original; refusing to change it")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/cmdline-tools" ]; then
            echo "Android SDK command-line tools not found under $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager executable not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37-ext2" "build-tools;37.0.0"

      - name: Download required native libraries
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.ZALOXPOSEDNATIVE_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing repository secret ZALOXPOSEDNATIVE_REPO_TOKEN (required for ZaloXposedNative)."
            exit 1
          fi
          ASSET_URL="$(gh api repos/ElectroHeavenVN/ZaloXposedNative/releases/tags/lib --jq '.assets[] | select(.name == "Output.zip") | .url')"
          if [ -z "$ASSET_URL" ]; then
            echo "Output.zip not found in ZaloXposedNative release tag lib"
            exit 1
          fi
          gh api "$ASSET_URL" --header 'Accept: application/octet-stream' > "$RUNNER_TEMP/Output.zip"
          mkdir -p ZaloXposedNative
          unzip -q -o "$RUNNER_TEMP/Output.zip" -d ZaloXposedNative

      - name: Build PyzTech debug APK
        working-directory: source
        shell: bash
        run: |
          chmod +x ./gradlew
          VERSION_CODE="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PversionCode="$VERSION_CODE" \
            -PversionName="PyzTech-$SHORT_SHA"

      - name: Collect APK
        working-directory: source
        shell: bash
        run: |
          mkdir -p release
          find app/build/outputs/apk/debug -type f -name '*.apk' -exec cp {} release/PyzTech-debug.apk \;
          test -s release/PyzTech-debug.apk

      - name: Upload PyzTech APK
        uses: actions/upload-artifact@v4
        with:
          name: PyzTech-debug-apk
          path: source/release/PyzTech-debug.apk
          if-no-files-found: error
